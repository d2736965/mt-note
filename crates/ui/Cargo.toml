[package]
name = "ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { workspace = true, features = ["asset"] }
models = { workspace = true }
stylance = { workspace = true }
manganis = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
paste = { workspace = true }
thiserror = { workspace = true }
getset = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
stylance-cli = { workspace = true }

[package.metadata.stylance]
output_file = "./assets/styles/dist/bundle-ui.scss"
scss_prelude = '''
@use "../reset";
'''

[features]

[package.metadata.cargo-machete]
ignored = ["api", "manganis", "stylance-cli"]
