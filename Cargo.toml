[workspace]
resolver = "2"
members = [
    "crates/ui",
    "crates/mobile",
    "crates/utils",
    "crates/models",
    "crates/models-macros",
    "crates/persist",
    "crates/fs-engine",
    "crates/typst-engine",
    "crates/editor-lsp",
]

[workspace.dependencies]
ui = { path = "crates/ui" }
models = { path = "crates/models" }
models-macros = { path = "crates/models-macros" }
persist = { path = "crates/persist" }
mt-note-fs-engine = { path = "crates/fs-engine" }
mt-note-typst-engine = { path = "crates/typst-engine" }
mt-note-editor-lsp = { path = "crates/editor-lsp" }
js-bridge-bindgen = { path = "crates/js-bridge-bindgen" }
typst = "0.15.0"
typst-bundle = "0.15.0"
typst-eval = "0.15.0"
typst-html = "0.15.0"
typst-layout = "0.15.0"
typst-library = "0.15.0"
typst-macros = "0.15.0"
typst-pdf = "0.15.0"
typst-realize = "0.15.0"
typst-render = "0.15.0"
typst-svg = "0.15.0"
typst-syntax = "0.15.0"
typst-timing = "0.15.0"
typst-utils = "0.15.0"
typst-kit = "0.15.0"
# ecow 必须锁定 0.2，typst 0.15 依赖 ecow 0.2.6，>0.3 会导致 EcoVec 类型不兼容
ecow = "0.2"
subsetter = "0.2.6"
base64 = { version = "0.22.1", features = ["alloc"] }
dioxus = "0.7.10"
dioxus-i18n = "0.6"
log = "0.4.29"
tracing = "0.1"
stylance = "0.8.0"
stylance-cli = "0.8.0"
thiserror = "2.0"
serde = "1.0"
serde_json = "1.0"
manganis = "0.7.10"
derive_more = "2.1"
paste = "1.0"
jni = "0.22"
ndk-context = "0.1"
getset = "0.1"
# tinymist依赖0.95.0
lsp-types = { version = "=0.95.0", features = ["proposed"] }
dirs = "6.0"
ignore = "0.4"
urlencoding = "2.1"
tokio = "1"
kameo = "0.21"
pulldown-cmark = "0.13"
rayon = "1.12"
tinymist-query = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-project = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-world = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-std = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-analysis = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-lint = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-vfs = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-package = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-task = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
tinymist-render = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
typst-shim = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }
typst-assets = { git = "https://github.com/Myriad-Dreamin/tinymist", tag = "v0.15.0" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[workspace.metadata.dylint]
libraries = [{ path = "lints/rust-dylint" }]

[patch.crates-io]
typst = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-bundle = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-eval = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-html = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-layout = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-library = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-macros = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-pdf = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-realize = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-render = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-svg = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-syntax = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-timing = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-utils = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
typst-kit = { git = "https://github.com/Myriad-Dreamin/typst", tag = "tinymist/v0.15.0" }
